<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Movie Predictor</title>
  <meta name="theme-color" content="#1f1f1f">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #141414;
      --card: #1f1f1f;
      --accent: #f5c518;
      --text: #eee;
      --muted: rgba(238, 238, 238, 0.6);
      --pos: #2ecc71;
      --neg: #e74c3c;
      --warn: #e67e22;
    }

    html,
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      min-height: 100vh;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(16px, env(safe-area-inset-top)) 16px 24px;
    }

    header {
      width: 100%;
      max-width: 480px;
      text-align: center;
      padding: 12px 0 4px;
    }

    header h1 {
      color: var(--accent);
      font-size: 20px;
      letter-spacing: 0.3px;
    }

    header p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    /* Input fallback (shown when no shared URL) */
    .input-row {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 8px;
      margin: 16px 0 8px;
    }

    .input-row input {
      flex: 1;
      background: var(--card);
      border: 1px solid #444;
      border-radius: 10px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }

    .input-row input:focus {
      border-color: var(--accent);
    }

    .input-row button {
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .hint {
      width: 100%;
      max-width: 480px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      margin-bottom: 8px;
    }

    /* Status / loading / error */
    #status {
      width: 100%;
      max-width: 480px;
      /* min-height: 60px; */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 16px 0;
    }

    #status.error {
      color: var(--neg);
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #333;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Prediction card */
    #card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      display: none;
    }

    #card.show {
      display: block;
    }

    .movie-title {
      color: var(--accent);
      font-weight: bold;
      font-size: 17px;
      line-height: 1.3;
    }

    .movie-meta {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .big-rating {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      margin: 16px 0 4px;
    }

    .big-rating .num {
      font-size: 52px;
      font-weight: 800;
      color: var(--accent);
      line-height: 1;
    }

    .big-rating .den {
      color: var(--muted);
      font-size: 18px;
    }

    .public-rating {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .range-note {
      background: #181818;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12.5px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 14px;
    }

    .range-note b {
      color: var(--text);
    }

    .warn-note {
      color: var(--warn);
      font-size: 12.5px;
      text-align: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 13px;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .factor {
      margin-bottom: 10px;
    }

    .factor-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .factor-val {
      font-weight: bold;
    }

    .factor-bar {
      background: #333;
      border-radius: 3px;
      height: 5px;
      overflow: hidden;
    }

    .factor-bar>div {
      height: 100%;
      border-radius: 3px;
    }

    .member {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      color: var(--muted);
      padding: 1px 0 1px 14px;
    }

    /* Expandable factor groups (kept visually identical to plain factors) */
    .factor.expandable>.factor-row {
      cursor: pointer;
      user-select: none;
    }

    .factor .toggle {
      display: inline-block;
      width: 12px;
      color: var(--muted);
      font-size: 10px;
      transition: transform 0.15s ease;
    }

    .factor.open .toggle {
      transform: rotate(90deg);
    }

    .factor .children {
      display: none;
    }

    .factor.open>.children {
      display: block;
    }

    .factor.sub {
      margin: 6px 0 0 14px;
    }

    .genres {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
      justify-content: center;
    }

    .genre-chip {
      background: #2a2a2a;
      border: 1px solid #3d3d3d;
      color: var(--muted);
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 12px;
    }

    .imdb-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: var(--accent);
      font-size: 13px;
      text-decoration: none;
    }

    footer {
      margin-top: auto;
      padding-top: 24px;
      color: rgba(238, 238, 238, 0.35);
      font-size: 11px;
      text-align: center;
    }

    /* ---------- Tabs ---------- */
    .tabs {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 6px;
      background: var(--card);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 4px;
      margin: 12px 0;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      color: var(--muted);
      border: none;
      border-radius: 9px;
      padding: 9px 0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #111;
    }

    .view[hidden] {
      display: none !important;
    }

    .view {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- Trending controls ---------- */
    .trending-controls {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid #333;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: space-between;
    }

    .control-row label {
      font-size: 13px;
      color: var(--muted);
    }

    .segmented {
      display: flex;
      gap: 4px;
      background: #181818;
      border-radius: 9px;
      padding: 3px;
    }

    .segmented button {
      background: transparent;
      color: var(--muted);
      border: none;
      border-radius: 7px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .segmented button.active {
      background: var(--accent);
      color: #111;
    }

    .topn-select {
      background: #181818;
      color: var(--text);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .fetch-btn {
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .fetch-btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* ---------- Trending list ---------- */
    #tStatus {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      padding: 14px 0;
    }

    #tStatus.error {
      color: var(--neg);
    }

    #tList {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .t-hint {
      width: 100%;
      max-width: 480px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
      padding: 12px 4px 0;
    }

    .t-hint b {
      color: var(--text);
    }

    .t-hint.hidden {
      display: none;
    }

    .trow {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid #2c2c2c;
      border-radius: 12px;
      padding: 12px 14px;
    }

    .trow .rank {
      color: var(--muted);
      font-size: 13px;
      font-weight: bold;
      min-width: 20px;
      text-align: right;
    }

    .trow .tmain {
      flex: 1;
      min-width: 0;
    }

    .trow .tname {
      font-size: 14px;
      color: var(--text);
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .trow .tname:hover {
      color: var(--accent);
    }

    .trow .tid {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .score {
      min-width: 62px;
      text-align: right;
      font-weight: 800;
      font-size: 20px;
      color: var(--accent);
    }

    .score.pending {
      color: var(--muted);
      font-weight: 400;
      font-size: 14px;
    }

    /* Small inline spinner shown in a score cell while its /predict is in flight */
    .score-spin {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #333;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      vertical-align: middle;
    }

    .score.err {
      color: var(--neg);
      font-weight: 400;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎬 Mat's Movie Predictor</h1>
    <!-- <p>Your personal predicted IMDb rating</p> -->
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabPredictor" data-view="predictor">Predictor</button>
    <button class="tab-btn" id="tabTrending" data-view="trending">🔥 Trending</button>
  </div>

  <!-- ============ Predictor view (default, unchanged behavior) ============ -->
  <div class="view" id="viewPredictor">

    <div class="input-row" id="inputRow">
      <input id="urlInput" type="text" placeholder="Paste an IMDb link or tt-ID or share via other app…"
        autocomplete="off" inputmode="url">
      <button id="goBtn">Go</button>
    </div>
    <!-- <div class="hint">Tip: in any app, tap <b>Share → Movie Predictor</b> to skip typing.</div> -->

    <div id="status"></div>

    <div id="card">
      <div class="movie-title" id="cTitle"></div>
      <div class="movie-meta" id="cMeta"></div>
      <div class="genres" id="cGenres"></div>
      <div class="big-rating"><span class="num" id="cRating"></span><span class="den">/ 10</span></div>
      <div class="public-rating" id="cPublic"></div>
      <div class="range-note" id="cRange" style="display:none;"></div>
      <div class="warn-note" id="cWarn" style="display:none;">⚠ No plot text found — metadata only.</div>
      <div class="section-title">Why this rating?</div>
      <div id="cFactors"></div>
      <a class="imdb-link" id="cLink" target="_blank" rel="noopener">Open on IMDb ↗</a>
    </div>

  </div><!-- /viewPredictor -->

  <!-- ============ Trending view ============ -->
  <div class="view" id="viewTrending" hidden>

    <div class="trending-controls">
      <div class="control-row">
        <label>Chart</label>
        <div class="segmented" id="chartSeg">
          <button type="button" class="active" data-chart="movies">Movies</button>
          <button type="button" data-chart="series">Series</button>
        </div>
      </div>
      <div class="control-row">
        <label for="topN">How many</label>
        <select class="topn-select" id="topN">
          <option value="5">Top 5</option>
          <option value="10" selected>Top 10</option>
          <option value="15">Top 15</option>
          <option value="20">Top 20</option>
          <option value="25">Top 25</option>
        </select>
      </div>
      <button class="fetch-btn" id="fetchBtn" disabled>Load list</button>
    </div>

    <div id="tStatus"></div>
    <div id="tList"></div>
    <div class="t-hint" id="tHint">Pick how many, tap <b>Load list</b> to fetch the
      current IMDb chart, then <b>Fetch scores</b> to predict each one.</div>

  </div><!-- /viewTrending -->

  <!-- <footer> · Mat's Movie Predictor · </footer> -->

  <script>
    const API_BASE = 'https://mats-movie-preds-api.onrender.com';
    // const API_BASE = 'http://127.0.0.1:8000';

    const statusEl = document.getElementById('status');
    const cardEl = document.getElementById('card');
    const inputEl = document.getElementById('urlInput');

    // ---------- ID extraction ----------
    function extractImdbId(text) {
      if (!text) return null;
      const m = String(text).match(/tt\d{7,10}/i);
      return m ? m[0] : null;
    }

    // ---------- Status helpers ----------
    function showLoading(msg) {
      cardEl.classList.remove('show');
      statusEl.className = '';
      statusEl.innerHTML = `<div class="spinner"></div><div>${msg}</div>`;
    }
    function showError(msg) {
      cardEl.classList.remove('show');
      statusEl.className = 'error';
      statusEl.textContent = msg;
    }
    function hideStatus() { statusEl.innerHTML = ''; statusEl.className = ''; }

    // ---------- API ----------
    let fetchInFlight = null; // guard against duplicate concurrent fetches

    async function fetchPrediction(imdbId) {
      if (fetchInFlight) {
        console.warn('[predictor] fetch already in flight, ignoring duplicate call for', imdbId);
        return;
      }
      console.log('[predictor] fetchPrediction called for', imdbId);
      showLoading('Fetching prediction…<br><small>(Render free tier can take ~60s to wake up)</small>');
      const started = Date.now();
      const url = `${API_BASE}/predict?imdb_id=${encodeURIComponent(imdbId)}&explain=1`;
      fetchInFlight = (async () => {
        try {
          const res = await fetch(url);
          if (!res.ok) {
            const body = await res.text().catch(() => '<no body>');
            console.error(`[predictor] HTTP ${res.status} ${res.statusText} for ${url}\nResponse body:`, body);
            throw new Error(`API returned HTTP ${res.status}`);
          }
          const data = await res.json();
          console.debug('[predictor] API response:', data);

          if (data.error) {
            // Error generated by the API itself (e.g. unknown ID, model failure)
            console.error(`[predictor] API error for ${imdbId}:`, data.error);
            throw new Error(
              `No prediction for ${imdbId}. It may be too new/obscure for the model, ` +
              `or the ID doesn't exist. (API said: "${data.error}")`);
          }

          // If the cold start ate most of the wait, swap the message quickly
          if (Date.now() - started > 8000) showLoading('Almost there…');
          renderCard(data);
        } catch (err) {
          if (err instanceof TypeError) {
            // fetch() itself failed: network down, DNS, CORS, or server asleep
            console.error(`[predictor] Network/request failure for ${url}:`, err);
            showError('Could not reach the API. Check your connection — ' +
              'if on Render free tier, the service may be waking up. Try again in a minute.');
          } else if (!statusEl.classList.contains('error')) {
            console.error('[predictor] Prediction failed:', err);
            showError(err.message);
          }
        }
      })();
      try {
        await fetchInFlight;
      } finally {
        fetchInFlight = null;
      }
    }

    // ---------- Rendering ----------
    // Actor/writer sub-features are merged into single expandable rows
    const MERGE_DEFS = [
      {
        label: 'Actors',
        match: n => /(actor|cast)/i.test(n),
        rename: n => n.replace(' (your history)', '')
          .replace('Best actor', 'Best').replace('Worst actor', 'Worst')
          .replace('Cast', 'Cast average')
      },
      {
        label: 'Writers',
        match: n => /writer/i.test(n),
        rename: n => n.replace(' (your history)', '')
          .replace('Best writer', 'Best').replace('Worst writer', 'Worst')
          .replace(/^Writers$/, 'Writers average')
      }
    ];

    function factorRow(r, maxAbs) {
      const c = r.contribution || 0;
      const pos = c >= 0;
      const color = pos ? 'var(--pos)' : 'var(--neg)';
      const pct = Math.min(Math.abs(c) / maxAbs * 100, 100);
      const valTxt = r.value !== null && r.value !== undefined ? ` (${r.value})` : '';
      const contrib = `<span class="factor-val" style="color:${color};">${pos ? '+' : ''}${c.toFixed(2)}</span>`;

      const hasChildren = r.children && r.children.length;
      const toggle = hasChildren ? '<span class="toggle">▶</span> ' : '';
      const cls = hasChildren ? 'factor expandable' : 'factor';

      const row = `
          <div class="factor-row">
            <span>${toggle}${r.name}${valTxt}</span>
            ${contrib}
          </div>
          <div class="factor-bar"><div style="width:${pct}%;background:${color};"></div></div>`;

      // Plain (level 1) row when there is nothing to expand
      if (!hasChildren) {
        return `<div class="${cls}">${row}</div>`;
      }

      // Level 1 group: same look as a plain factor, plus click-to-expand level 2
      const kids = r.children.map(k => {
        const kc = k.contribution || 0;
        const kpos = kc >= 0;
        const kcolor = kpos ? 'var(--pos)' : 'var(--neg)';
        const kval = k.value !== null && k.value !== undefined ? ` (${k.value})` : '';
        const kpct = Math.min(Math.abs(kc) / maxAbs * 100, 100);
        return `
          <div class="factor sub">
            <div class="factor-row">
              <span>${k.name}${kval}</span>
              <span class="factor-val" style="color:${kcolor};">${kpos ? '+' : ''}${kc.toFixed(2)}</span>
            </div>
            <div class="factor-bar"><div style="width:${kpct}%;background:${kcolor};"></div></div>
          </div>`;
      }).join('');

      return `
        <div class="${cls}">
          ${row}
          <div class="children">${kids}</div>
        </div>`;
    }

    // Toggle a group open/closed when its level-1 row is clicked
    document.getElementById('cFactors').addEventListener('click', (e) => {
      const head = e.target.closest('.factor.expandable > .factor-row');
      if (head) head.parentElement.classList.toggle('open');
    });

    function buildFactorList(exp) {
      const factors = (exp && exp.factors) ? exp.factors.slice() : [];
      const maxAbs = Math.max(...factors.map(f => Math.abs(f.contribution || 0)), 0.01);
      const rows = [];
      const used = new Set();

      // 1) merged actor/writer rows
      for (const def of MERGE_DEFS) {
        const items = factors.filter(f => !used.has(f) && def.match(f.name));
        items.forEach(f => used.add(f));
        if (items.length) {
          rows.push({
            name: def.label,
            value: null,
            contribution: items.reduce((s, f) => s + (f.contribution || 0), 0),
            children: items
              .sort((a, b) => Math.abs(b.contribution) - Math.abs(a.contribution))
              .map(f => ({ name: def.rename(f.name), contribution: f.contribution, value: f.value })),
          });
        }
      }

      // 2) everything else (member groups like Plot vibe/Genres become expandable too)
      for (const f of factors) {
        if (used.has(f)) continue;
        rows.push({
          name: f.name,
          value: f.value,
          contribution: f.contribution,
          children: (f.members || []).map(m => ({ name: m.name, contribution: m.contribution })),
        });
      }

      rows.sort((a, b) => Math.abs(b.contribution) - Math.abs(a.contribution));
      return rows.map(r => factorRow(r, maxAbs)).join('');
    }

    function renderCard(data) {
      hideStatus();
      const rating = Number(data.predicted_rating).toFixed(1);

      document.getElementById('cTitle').textContent =
        data.title ? data.title : data.imdb_id;
      document.getElementById('cMeta').textContent =
        [data.year, data.directors && data.directors.length ? data.directors.join(', ') : null]
          .filter(Boolean).join(' · ');
      document.getElementById('cRating').textContent = rating;
      document.getElementById('cPublic').textContent =
        data.imdb_public_rating != null
          ? `IMDb public rating: ${Number(data.imdb_public_rating).toFixed(1)}/10`
          : '';

      const exp = data.explanation;
      const rangeEl = document.getElementById('cRange');
      if (exp && exp.mae) {
        rangeEl.style.display = 'block';
        rangeEl.innerHTML =
          `Your average: <b>${exp.base.toFixed(2)}</b> · likely range ` +
          `<b>${(data.predicted_rating - exp.mae).toFixed(1)}–${(data.predicted_rating + exp.mae).toFixed(1)}</b>`;
      } else {
        rangeEl.style.display = 'none';
      }

      document.getElementById('cWarn').style.display =
        exp && exp.plot_available === false ? 'block' : 'none';

      const factorsEl = document.getElementById('cFactors');
      if (exp && exp.factors && exp.factors.length) {
        factorsEl.innerHTML = buildFactorList(exp);
      } else {
        factorsEl.innerHTML = '<div style="color:var(--muted);font-size:13px;">No explanation available.</div>';
      }

      const genresEl = document.getElementById('cGenres');
      genresEl.innerHTML = (data.genres || [])
        .map(g => `<span class="genre-chip">${g}</span>`).join('');

      document.getElementById('cLink').href =
        `https://www.imdb.com/title/${data.imdb_id}/`;

      cardEl.classList.add('show');
      saveResult(data); // persist so a surprise reload can restore this
    }

    // ---------- Result persistence (survives surprise reloads) ----------
    const RESULT_KEY = 'lastPrediction';
    const RESULT_TTL = 10 * 60 * 1000; // 10 minutes

    function saveResult(data) {
      try {
        localStorage.setItem(RESULT_KEY,
          JSON.stringify({ ts: Date.now(), imdbId: data.imdb_id, data }));
      } catch (_) { }
    }
    function loadSavedResult() {
      try {
        const s = JSON.parse(localStorage.getItem(RESULT_KEY));
        if (s && s.data && Date.now() - s.ts < RESULT_TTL) return s;
      } catch (_) { }
      return null;
    }

    // ======================================================================
    // TRENDING TAB
    // ----------------------------------------------------------------------
    // Cost-safety rules:
    //  1) Nothing here runs on page load. The IMDb chart is scraped only when
    //     the user actually opens the Trending tab.
    //  2) The (expensive) /predict API is NEVER called during a scrape — the
    //     user must press "Fetch scores".
    //  3) Fetched scores are cached per (chart, N) in localStorage for TTL.
    // ======================================================================

    // Data source: the open-source "IMDb Popular" Stremio addon. It exposes
    // IMDb's trending/popular/top-rated catalogs as plain JSON (no scraping,
    // no API key, no CORS proxy — Stremio addons are CORS-enabled by design).
    // Each catalog returns { metas: [{ id: "tt...", name, year, imdbRating … }] }.
    const STREMIO_BASE = 'https://imdb-popular-stremio.vercel.app';
    // Each chart maps to a catalog type ("movie" | "series") + catalog id.
    // URL shape: {base}/catalog/{type}/{id}.json
    const CHARTS = {
      movies: { type: 'movie', path: 'imdb-trending-movies', label: 'IMDb Trending Movies' },
      series: { type: 'series', path: 'imdb-trending-series', label: 'IMDb Trending Series' },
    };
    const TRENDING_TTL = 10 * 60 * 1000; // 10 minutes
    const TRENDING_KEY_PREFIX = 'trending:';

    const tStatusEl = document.getElementById('tStatus');
    const tListEl = document.getElementById('tList');
    const tHintEl = document.getElementById('tHint');
    const fetchBtn = document.getElementById('fetchBtn');
    const topNEl = document.getElementById('topN');
    const chartSegEl = document.getElementById('chartSeg');

    // Trending state — never triggers network on its own.
    let tState = {
      chart: 'movies',
      topN: 10,
      items: [],      // [{ rank, id, url, title, year, imdbRating, rating|null, error|null }]
      loaded: false,  // a list is currently displayed?
      scoring: false, // a sequential predict run is in progress
    };

    // ---------- Fetch the catalog -> ordered [{id, title, year, imdbRating}] ----------
    // Stremio catalog JSON: { metas: [{ id:"tt...", name, year, imdbRating … }] }.
    async function getTopItems(chartKey, limit = 10) {
      const chart = CHARTS[chartKey];
      const url = `${STREMIO_BASE}/catalog/${chart.type}/${chart.path}.json`;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 15000);
      let data;
      try {
        const resp = await fetch(url, { signal: ctrl.signal });
        if (!resp.ok) throw new Error(`catalog HTTP ${resp.status}`);
        data = await resp.json();
      } finally {
        clearTimeout(timer);
      }

      const metas = (data && data.metas) || [];
      const seen = new Set();
      const items = [];
      for (const m of metas) {
        const id = String(m.id || '').match(/^tt\d+$/i)?.[0];
        if (!id || seen.has(id)) continue;
        seen.add(id);
        items.push({
          id,
          title: m.name || id,
          year: m.year || null,
          imdbRating: (m.imdbRating != null && m.imdbRating !== '') ? Number(m.imdbRating) : null,
        });
        if (items.length >= limit) break;
      }
      return items;
    }

    // ---------- Trending UI helpers ----------
    function tSetStatus(msg, isError = false) {
      tStatusEl.className = isError ? 'error' : '';
      tStatusEl.innerHTML = isError
        ? msg
        : `<div class="spinner"></div><div>${msg}</div>`;
    }
    function tClearStatus() { tStatusEl.innerHTML = ''; tStatusEl.className = ''; }

    function trendingCacheKey() { return `${TRENDING_KEY_PREFIX}${tState.chart}:${tState.topN}`; }

    function saveTrendingCache() {
      try {
        localStorage.setItem(trendingCacheKey(), JSON.stringify({
          ts: Date.now(),
          items: tState.items.map(i => ({ id: i.id, rating: i.rating, error: i.error })),
        }));
      } catch (_) { }
    }
    function loadTrendingCache() {
      try {
        const s = JSON.parse(localStorage.getItem(trendingCacheKey()));
        if (s && s.items && Date.now() - s.ts < TRENDING_TTL) return s.items;
      } catch (_) { }
      return null;
    }

    // Render the list from tState.items. Rows without a rating show a dash.
    function renderTrendingList() {
      if (!tState.items.length) {
        tListEl.innerHTML = '';
        return;
      }
      tListEl.innerHTML = tState.items.map((it, idx) => {
        const scoreCls = it.error ? 'score err' : (it.rating == null ? 'score pending' : 'score');
        const scoreTxt = it.error ? 'n/a'
          : (it.rating == null ? '—' : Number(it.rating).toFixed(1));
        // Show "2024 · 8/10" (year · current IMDb rating) instead of the tt-ID.
        const imdb = it.imdbRating != null ? `${it.imdbRating}/10` : null;
        const meta = [it.year, imdb].filter(Boolean).join(' · ');
        return `
          <div class="trow" data-idx="${idx}">
            <div class="rank">${it.rank}</div>
            <div class="tmain">
              <a class="tname" href="${it.url}" target="_blank" rel="noopener">${it.title || it.id}</a>
              <div class="tid">${meta}</div>
            </div>
            <div class="${scoreCls}" data-score-for="${idx}">${scoreTxt}</div>
          </div>`;
      }).join('');
    }

    // Show a small spinner in a row's score cell while its /predict is in flight.
    function setRowLoading(idx) {
      const el = tListEl.querySelector(`[data-score-for="${idx}"]`);
      if (!el) return;
      el.className = 'score pending';
      el.removeAttribute('title');
      el.innerHTML = '<span class="score-spin"></span>';
    }

    function setRowScore(idx, ratingOrNull, errorOrNull) {
      const el = tListEl.querySelector(`[data-score-for="${idx}"]`);
      if (!el) return;
      if (errorOrNull) {
        el.className = 'score err';
        el.textContent = 'n/a';
        el.title = errorOrNull;
      } else {
        el.className = 'score';
        el.textContent = Number(ratingOrNull).toFixed(1);
        el.removeAttribute('title');
      }
    }

    // The single button is two-phase: first it loads the chart list (cheap,
    // public catalog), then it scores the loaded rows (the only /predict call).
    function updateButtonState() {
      if (tState.scoring) {
        fetchBtn.disabled = true;
        fetchBtn.textContent = 'Scoring…';
      } else if (!tState.loaded) {
        fetchBtn.disabled = false;
        fetchBtn.textContent = 'Load list';
      } else {
        fetchBtn.disabled = false;
        fetchBtn.textContent = 'Fetch scores';
      }
    }

    // Returns the trending tab to a "nothing loaded yet" state. Changing N
    // does NOT auto-fetch — the user must press the button.
    function resetTrendingSelection() {
      tState.loaded = false;
      tState.items = [];
      tListEl.innerHTML = '';
      tHintEl.classList.remove('hidden');
      tClearStatus();
      updateButtonState();
    }

    // ---------- Load list + render (NO predict calls) ----------
    async function loadTrendingList() {
      tState.loaded = false;
      tState.items = [];
      fetchBtn.disabled = true;
      tListEl.innerHTML = '';

      // If we have a fresh cached score set for this catalog/N, reuse it.
      const cached = loadTrendingCache();

      tSetStatus(`Loading ${CHARTS[tState.chart].label}…`);
      let items;
      try {
        items = await getTopItems(tState.chart, tState.topN);
      } catch (err) {
        console.error('[trending] catalog fetch failed:', err);
        tSetStatus('Could not load the IMDb chart. Check your connection ' +
          'and try again shortly.', true);
        updateButtonState();
        return;
      }

      if (!items.length) {
        tSetStatus('No titles found in the chart response.', true);
        updateButtonState();
        return;
      }

      // Rows start unscored (dash). No /predict calls happen here.
      tState.items = items.map((m, i) => ({
        rank: i + 1,
        id: m.id,
        url: `https://www.imdb.com/title/${m.id}/`,
        title: m.title,
        year: m.year,
        imdbRating: m.imdbRating,
        rating: null,
        error: null,
      }));

      // Merge in any cached scores so returning users see numbers for free.
      if (cached) {
        const byId = new Map(cached.map(c => [c.id, c]));
        for (const it of tState.items) {
          const c = byId.get(it.id);
          if (c) { it.rating = c.rating ?? null; it.error = c.error ?? null; }
        }
        tClearStatus();
      } else {
        tClearStatus();
      }

      tState.loaded = true;
      tHintEl.classList.add('hidden');
      renderTrendingList();
      updateButtonState();
    }

    // ---------- Sequential scoring: the ONLY place /predict is called ----------
    async function fetchTrendingScores() {
      if (tState.scoring || !tState.items.length) return;
      tState.scoring = true;
      updateButtonState();

      // Only rows that don't already have a rating/error need a /predict call.
      const pendingIdx = [];
      tState.items.forEach((it, i) => {
        if (it.rating == null && !it.error) pendingIdx.push(i);
      });

      // Guard rail: never re-fire /predict for rows already scored.
      if (!pendingIdx.length) {
        tClearStatus();
        tState.scoring = false;
        updateButtonState();
        return;
      }

      tSetStatus(`Scoring 0/${pendingIdx.length}…`);

      let done = 0;
      for (const i of pendingIdx) {
        const it = tState.items[i];
        done++;
        tSetStatus(`Scoring ${done}/${pendingIdx.length}… <small>(${it.title || it.id})</small>`);
        setRowLoading(i); // show a spinner in this row's score cell
        try {
          const res = await fetch(
            `${API_BASE}/predict?imdb_id=${encodeURIComponent(it.id)}`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (data && data.error) throw new Error(data.error);
          it.rating = data.predicted_rating;
          it.error = null;
          setRowScore(i, it.rating, null); // replace spinner with the number
        } catch (err) {
          console.warn(`[trending] predict failed for ${it.id}:`, err);
          it.rating = null;
          it.error = String(err.message || err);
          setRowScore(i, null, it.error);
        }
        saveTrendingCache(); // persist after each row so progress survives a reload
      }

      tClearStatus();
      tState.scoring = false;
      updateButtonState();
    }

    // ---------- Tab switching ----------
    const tabButtons = document.querySelectorAll('.tab-btn');
    const views = {
      predictor: document.getElementById('viewPredictor'),
      trending: document.getElementById('viewTrending'),
    };

    function showView(name) {
      if (!views[name]) return;
      for (const [key, el] of Object.entries(views)) el.hidden = key !== name;
      tabButtons.forEach(b => b.classList.toggle('active', b.dataset.view === name));
      // Only swap the hash — keep any ?query (e.g. share params) intact.
      try { history.replaceState(null, '', `${location.pathname}${location.search}#${name}`); } catch (_) { }
      // NOTE: switching tabs performs NO network work by design.
    }

    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => showView(btn.dataset.view));
    });

    // ---------- Chart (Movies / Series) control ----------
    // Switching chart only updates state and clears the list. It does NOT load
    // and does NOT call /predict — the user presses the button.
    chartSegEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-chart]');
      if (!btn || btn.classList.contains('active')) return;
      chartSegEl.querySelectorAll('button').forEach(b =>
        b.classList.toggle('active', b === btn));
      tState.chart = btn.dataset.chart;
      resetTrendingSelection();
    });

    // ---------- Top-N control ----------
    // Changing N only updates state and clears the current list. It does NOT
    // load and does NOT call /predict — the user presses the button.
    topNEl.addEventListener('change', () => {
      tState.topN = parseInt(topNEl.value, 10) || 10;
      resetTrendingSelection();
    });

    // Two-phase button: "Load list" (scrape only) then "Fetch scores" (/predict).
    fetchBtn.addEventListener('click', () => {
      if (!tState.loaded) loadTrendingList();
      else fetchTrendingScores();
    });

    // Initial button label — no network here.
    updateButtonState();

    // ---------- Lifecycle diagnostics ----------
    console.log('[predictor] script start:', location.href);
    window.addEventListener('beforeunload', () =>
      console.warn('[predictor] page unloading — if you did not navigate away, something reloaded the app'));
    document.addEventListener('visibilitychange', () =>
      console.log('[predictor] visibilitychange:', document.visibilityState));
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () =>
        console.warn('[predictor] SW controller changed (service worker took over the page)'));
    }

    // ---------- Entry points ----------
    function handleInput() {
      const id = extractImdbId(inputEl.value.trim());
      if (!id) {
        showError('Could not find an IMDb ID (looks like "tt1234567") in that text.');
        return;
      }
      inputEl.value = '';
      // Keep the ID in the URL so a reload re-triggers the same prediction
      history.replaceState(null, '', `./index.html?id=${id}`);
      fetchPrediction(id);
    }

    document.getElementById('goBtn').addEventListener('click', handleInput);
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleInput(); });

    // Flag so a share-target launch always wins over any leftover #hash.
    let launchedFromShare = false;

    window.addEventListener('load', () => {
      console.log('[predictor] load event fired');
      // Register service worker for installability/offline shell
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => { });
      }

      // 1) Share Target launch: params arrive as ?title=...&text=...&url=...
      const params = new URLSearchParams(location.search);
      const sharedId =
        extractImdbId(params.get('url')) ||
        extractImdbId(params.get('text')) ||
        extractImdbId(params.get('title')) ||
        extractImdbId(params.get('id')); // set by handleInput, survives reloads

      if (sharedId) {
        // A shared link is always about predicting ONE title → show Predictor.
        launchedFromShare = true;
        showView('predictor');
        fetchPrediction(sharedId);
        return;
      }

      // 2) Manual launch: restore a recent result if we have one
      const saved = loadSavedResult();
      if (saved) {
        console.log('[predictor] restoring cached result for', saved.imdbId);
        renderCard(saved.data);
        return;
      }

      // 3) Nothing to show: focus the input
      inputEl.focus();
    });

    // Honor a #trending / #predictor deep link — but never override a share
    // launch, which must always land on the Predictor view.
    (function initTabFromHash() {
      if (launchedFromShare) return;
      const hash = (location.hash || '').replace('#', '');
      if (hash === 'trending' || hash === 'predictor') showView(hash);
    })();
  </script>
</body>

</html>
